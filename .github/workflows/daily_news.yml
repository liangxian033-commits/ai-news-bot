name: Daily AI News Robot

on:
  schedule:
    # 这里的 cron 是格林威治时间。0 0 代表北京时间早上 8 点
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许你手动点击运行测试

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检查代码
        uses: actions/checkout@v3

      - name: 安装 Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 安装依赖包
        run: npm install

      - name: 运行机器人
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }} # 这里会读取你待会设置的秘密钥匙
        run: node index.js
